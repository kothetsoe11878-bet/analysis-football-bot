name: SS2 Data Bridge Auto Update

on:
  workflow_dispatch:

jobs:
  bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run SS2 Data Bridge
        run: python convert_to_ss2.py

      - name: Save SS2 bridge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ss2/
          git diff --cached --quiet || git commit -m "Update SS2 bridge data"
          git push
